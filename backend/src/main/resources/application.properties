quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8081/realms/provider-followup}
quarkus.oidc.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:provider-followup-backend}
quarkus.oidc.credentials.secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:backend-secret}
quarkus.oidc.token.issuer=${KEYCLOAK_TOKEN_ISSUER:any}
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:provider}
quarkus.datasource.password=${POSTGRES_PASSWORD:provider}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/providerfollowup}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=import.sql
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:invoices}
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8000}
