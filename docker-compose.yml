services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: providerfollowup
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provider -d providerfollowup"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    build: ./ocr-service
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: invoices
      OCR_SPACE_API_KEY: K82588615788957
      OCR_SPACE_LANGUAGES: fre,eng
      OCR_SPACE_ENGINE: 2
      TESSERACT_LANGS: fra+eng
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/providerfollowup
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: invoices
      OCR_SERVICE_URL: http://ocr-service:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

  metabase:
    image: metabase/metabase:v0.50.31
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - metabase-data:/metabase-data

  metabase-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      - metabase
      - postgres
    environment:
      METABASE_URL: http://metabase:3000
      MB_ADMIN_EMAIL: admin@providerfollowup.local
      MB_ADMIN_PASSWORD: providerfollowup
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: providerfollowup
      APP_DB_USER: provider
      APP_DB_PASSWORD: provider
    volumes:
      - ./metabase/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    restart: "no"

volumes:
  postgres-data:
  minio-data:
  metabase-data:
