services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: providerfollowup
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provider -d providerfollowup"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Keycloak
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/provider-followup/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: minio-secret
      MINIO_IDENTITY_OPENID_SCOPES: openid,profile,email
      MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
      MINIO_IDENTITY_OPENID_REDIRECT_URI: http://localhost:9001/oauth_callback
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/provider-followup-realm.json:/opt/keycloak/data/import/provider-followup-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/provider-followup/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q 'provider-followup'\""]
      interval: 10s
      timeout: 5s
      retries: 30

  ocr-service:
    build: ./ocr-service
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: invoices
      OCR_SPACE_API_KEY: K82588615788957
      OCR_SPACE_LANGUAGES: fre,eng
      OCR_SPACE_ENGINE: 2
      TESSERACT_LANGS: fra+eng
      OCR_AI_ENABLED: "true"
      OCR_AI_PROVIDER: ollama
      OCR_AI_URL: http://ollama:11434/api/generate
      OCR_AI_MODEL: llama3.2:3b
      OCR_AI_TIMEOUT: 12
    depends_on:
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build: ./backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/providerfollowup
      POSTGRES_USER: provider
      POSTGRES_PASSWORD: provider
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: invoices
      OCR_SERVICE_URL: http://ocr-service:8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/provider-followup
      KEYCLOAK_BACKEND_CLIENT_ID: provider-followup-backend
      KEYCLOAK_BACKEND_CLIENT_SECRET: backend-secret
      KEYCLOAK_TOKEN_ISSUER: any
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: provider-followup
        VITE_KEYCLOAK_CLIENT_ID: provider-followup-frontend
        VITE_MINIO_CONSOLE_URL: http://localhost:9001
        VITE_METABASE_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:80"

  metabase:
    image: metabase/metabase:v0.50.31
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - metabase-data:/metabase-data

  metabase-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      - metabase
      - postgres
    environment:
      METABASE_URL: http://metabase:3000
      MB_ADMIN_EMAIL: admin@providerfollowup.local
      MB_ADMIN_PASSWORD: ProviderFollowup!2026
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_NAME: providerfollowup
      APP_DB_USER: provider
      APP_DB_PASSWORD: provider
    volumes:
      - ./metabase/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    restart: "no"

volumes:
  postgres-data:
  minio-data:
  metabase-data:
  keycloak-data:
  ollama-data:
